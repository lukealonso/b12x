[project]
name = "b12x"
version = "1.3.0"
description = "DGX Spark and RTX 6000-focused inference kernel library."
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [{ name = "Luke Alonso" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "torch>=2.12.0",
  "cuda-python",
  "nvidia-cutlass-dsl==4.6.2",
  "nvidia-cutlass-dsl-libs-base==4.6.2",
  "nvidia-cutlass-dsl-libs-core==4.6.2",
  "nvidia-cutlass-dsl-libs-cu12==4.6.2",
  "nvidia-cutlass-dsl-libs-cu13==4.6.2",
  "apache-tvm-ffi>=0.1.6,!=0.1.8,!=0.1.8.post0,<0.2",
  "rich>=13",
  "transformers>=4.51",
  "safetensors>=0.6",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "tomli>=2.0; python_version < '3.11'",
]

[build-system]
requires = ["setuptools>=77", "packaging>=24"]
build-backend = "setuptools.build_meta"

[project.entry-points."vllm.general_plugins"]
b12x_fp6 = "b12x.integration.vllm.plugin:register_b12x_fp6"
b12x_loader = "b12x.integration.vllm.loader:register_b12x_loader"

[project.scripts]
b12x-generate-gpu-profile = "b12x.tools.generate_gpu_profile:main"
b12x-inspect-model-policy = "b12x.tools.inspect_model_policy:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["b12x*"]

[tool.setuptools.package-data]
"b12x.policy._profiles" = ["data/*.json.gz"]
"b12x.comm.roce" = ["*.c"]
"b12x.loader" = ["*.c"]

[tool.ruff.lint]
select = ["E", "F", "B", "SIM"]
ignore = [
  "E402",
  "E501",
  "E741",
  "SIM102",
  "SIM108",
  "SIM118",
  "B019",
  "B020",
  "B023",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
